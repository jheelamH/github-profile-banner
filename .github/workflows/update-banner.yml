name: Update Dynamic GitHub Banner

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate Dynamic Banner
        run: python generate_banner.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add banner.png
          git commit -m "Updated dynamic cover image" || exit 0
          git push https://x-access-token:${{ secrets.JEYA }}@github.com/jheelamH/github-profile-banner.git main
